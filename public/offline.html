<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#002E35" />
  <title>Offline · SenseAgri</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: #002E35;
      color: #EAF2F2;
      font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 24px;
    }
    .card { max-width: 340px; }
    img { width: 84px; height: 84px; border-radius: 20px; margin-bottom: 22px; }
    h1 { font-size: 22px; margin: 0 0 10px; font-weight: 700; }
    p { font-size: 14.5px; line-height: 1.55; color: #A4BCBF; margin: 0 0 22px; }
    button {
      appearance: none; border: 1px solid rgba(111,197,208,0.35); background: #0d2a30;
      color: #EAF2F2; font-size: 14px; font-weight: 700; padding: 11px 20px; border-radius: 10px;
      cursor: pointer;
    }
    button:active { background: #10333a; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icon-192.png" alt="SenseAgri" />
    <h1>You're offline</h1>
    <p>SenseAgri needs a connection to show live sensor data and farm logs. Check your network and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
